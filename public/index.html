<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Decision Lean Finder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: linear-gradient(160deg, #f4f0e9 0%, #eae1cf 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #4a3a1e;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .icon { font-size: 2rem; margin-bottom: 4px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #8a5a1e; font-weight: 800; text-align: center; }
  .subtitle { color: #8a7355; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #fffdf9; border: 1px solid #e8d9b8; border-radius: 16px; padding: 28px 26px; box-shadow: 0 4px 16px rgba(138,90,30,0.08); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #4a3a1e; }
  textarea, input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #ddc99b;
    background: #fffef9; color: #4a3a1e; font-family: inherit; font-size: 1rem; margin-bottom: 18px; resize: vertical;
  }
  textarea:focus, input[type=text]:focus { outline: none; border-color: #8a5a1e; }
  button.action {
    width: 100%; padding: 13px 20px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 700; font-family: inherit; cursor: pointer; background: #8a5a1e; color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  button.action:hover:not(:disabled) { background: #714919; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #8a7355; min-height: 1.2em; }
  #resultBox { margin-top: 18px; }
  .lean-badge { display: inline-block; background: #f2e6c9; color: #8a5a1e; font-weight: 700; font-size: 0.85rem; padding: 6px 14px; border-radius: 999px; margin-bottom: 12px; }
  .summary { background: #fbf6ea; border: 1px solid #e8d9b8; border-radius: 10px; padding: 16px; font-size: 0.98rem; line-height: 1.6; color: #4a3a1e; }
  .footer-note { color: #8a7355; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #e8d9b8;
    border-top-color: #8a5a1e; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">⚖️</div>
    <h1>Decision Lean Finder</h1>
    <p class="subtitle">Enter your decision, pros, and cons — see which way they actually lean. 100% on-device.</p>

    <div class="card">
      <label for="decisionInput">The decision you're facing</label>
      <input type="text" id="decisionInput" placeholder="e.g. Take a new job offer" />
      <label for="prosInput">Your pros (one per line)</label>
      <textarea id="prosInput" rows="3" placeholder="e.g.&#10;higher salary&#10;more interesting work"></textarea>
      <label for="consInput">Your cons (one per line)</label>
      <textarea id="consInput" rows="3" placeholder="e.g.&#10;longer commute&#10;less job security"></textarea>
      <button class="action" id="generateBtn">Find the Lean</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const decisionInput = document.getElementById('decisionInput');
    const prosInput = document.getElementById('prosInput');
    const consInput = document.getElementById('consInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const decision = decisionInput.value.trim();
      const pros = prosInput.value.trim();
      const cons = consInput.value.trim();
      if (!decision || !pros || !cons) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Weighing it up...';

      try {
        const res = await fetch('/api/decision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decision, pros, cons }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `
          <div class="lean-badge">${escapeHtml(data.lean)}</div>
          <div class="summary">${escapeHtml(data.summary)}</div>
        `;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
